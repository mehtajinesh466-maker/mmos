<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Master Moves OS — Full Platform</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#17251F;--forest:#286957;--fd:#173F35;--fdd:#122F28;--brass:#C4A249;--brass2:#E7D9A6;--mint:#9DDDCB;--teal:#54D6DD;--canvas:#F5F2EA;--surface:#fff;--line:#E4DFD2;--muted:#7C8580;--hot:#A23B3B;--warm:#C8862A;--cold:#6B7A74;--ok:#2F8F6F;--sh:0 1px 2px rgba(23,37,31,.06),0 8px 24px rgba(23,37,31,.06);--r:14px}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,monospace}h1,h2,h3,h4{font-family:Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
button,select,input,textarea{font-family:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--fd);color:#EAF3EF;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 18px 14px;position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .bg{position:absolute;inset:0;opacity:.1;background-image:linear-gradient(45deg,#fff 25%,transparent 25% 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25% 75%,#fff 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.brand .w{position:relative;font-family:Georgia,serif;font-weight:700;font-size:18px;color:#fff}.brand .w b{color:var(--brass)}
.brand .s{position:relative;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mint);margin-top:3px}
.rl{padding:12px 14px 6px}.rl label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8FB6AB;display:block;margin-bottom:5px}
.rl select{width:100%;background:var(--fdd);color:#EAF3EF;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 9px;font-size:12.5px}
nav{padding:6px 10px;flex:1}
.ns{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#6f978b;padding:11px 10px 3px}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#CFE3DC;padding:8px 10px;border-radius:8px;font-size:12.8px;font-weight:500;margin:1px 0}
.ni .p{font-size:14px;width:16px;text-align:center;color:var(--mint)}
.ni:hover{background:rgba(255,255,255,.06);color:#fff}.ni.on{background:var(--brass);color:#241f10}.ni.on .p{color:#241f10}
.ni .ct{margin-left:auto;font-size:10px;background:rgba(255,255,255,.13);border-radius:20px;padding:1px 7px}
.ni .ct.hot{background:var(--hot);color:#fff}.ni.on .ct{background:rgba(0,0,0,.16)}
.cen{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.08)}
.cen .t{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FB6AB;margin-bottom:6px}
.chip{display:inline-flex;font-size:11px;color:#DCEBE5;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:3px 8px;margin:0 3px 4px 0}
.chip.on{background:var(--forest);border-color:var(--mint);color:#fff}.chip .so{font-size:8px;color:var(--brass2);margin-left:3px}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top .e{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:600}
.top h1{font-size:20px;margin-top:1px}
.top .gf{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .gf select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;background:#fff}
.view{padding:22px 26px 60px;max-width:1240px}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}
.kpis.k5{grid-template-columns:repeat(5,1fr)}.kpis.k3{grid-template-columns:repeat(3,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .n{font-family:Georgia,serif;font-weight:600;font-size:25px;margin:5px 0 3px;line-height:1.05}
.kpi .nn{font-size:11px;color:var(--muted)}.kpi .nn b{color:var(--forest)}
.kpi .sp{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);display:flex;gap:11px;font-size:10.5px;color:var(--muted)}.kpi .sp b{color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.g3{display:grid;grid-template-columns:1.4fr 1fr;gap:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:13px}
.panel h3{font-size:14.5px;margin-bottom:2px}.panel h3 .p{color:var(--brass);margin-right:6px;font-size:13px}
.panel .pd{font-size:11px;color:var(--muted);margin-bottom:11px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.cw{position:relative;height:220px}.cw.sm{height:180px}.cw.lg{height:270px}
.alert{background:#FBEEEA;border:1px solid #EBC9BE;border-left:4px solid var(--hot);border-radius:12px;padding:13px 16px;margin-bottom:15px;display:flex;gap:13px}
.alert .ic{font-size:19px}.alert .h{font-weight:700;color:var(--hot);font-size:13.5px}.alert .b{font-size:12.5px;color:#6a4a41;margin-top:2px}
.warn{background:#FBF2E7;border:1px solid #EAD5AE;border-left:4px solid var(--warm);border-radius:12px;padding:13px 16px;margin-bottom:15px}
.warn .h{font-weight:700;color:#8a6414;font-size:13.5px}.warn .b{font-size:12.5px;color:#9a7a3e;margin-top:2px}
.info{background:#EDF4F1;border:1px solid #CFE6DE;border-left:4px solid var(--forest);border-radius:12px;padding:12px 15px;margin-bottom:15px;font-size:12.5px;color:#33544b}.info b{color:var(--forest)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.2px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:8px 9px;border-bottom:1px solid var(--line);font-size:12.3px}
tbody tr.c{cursor:pointer}tbody tr.c:hover{background:var(--canvas)}
tfoot td{padding:8px 9px;font-weight:700;font-size:12.3px;background:var(--canvas);border-top:2px solid var(--line)}
th.r,td.r{text-align:right}
.pill{font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:20px;text-transform:uppercase;white-space:nowrap;display:inline-block}
.b-HOT{background:#F6E3E1;color:var(--hot)}.b-WARM{background:#F7E9D2;color:var(--warm)}.b-COLD{background:#E7ECEA;color:var(--cold)}.b-HEALTHY{background:#DCF0E8;color:var(--ok)}
.e-Engaged{background:#DCF0E8;color:var(--ok)}.e-Slipping{background:#F7E9D2;color:var(--warm)}.e-Dormant{background:#F6E3E1;color:var(--hot)}.e-Cold{background:#E7ECEA;color:var(--cold)}
.st-CURRENT{background:#DCF0E8;color:var(--ok)}.st-Completed{background:#E7ECEA;color:var(--cold)}.st-UNBILLED{background:#F6E3E1;color:var(--hot)}
.btn{background:var(--forest);color:#fff;border:0;border-radius:9px;padding:9px 15px;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--fd)}.btn.g{background:var(--brass);color:#241f10}.btn.gh{background:#fff;color:var(--forest);border:1px solid var(--line)}.btn.gh:hover{background:var(--canvas);color:var(--forest)}
.mini{font-size:11.5px;border:1px solid var(--line);background:#fff;color:var(--forest);border-radius:7px;padding:5px 10px;font-weight:600;white-space:nowrap}.mini:hover{background:var(--forest);color:#fff}
.exp{display:flex;gap:6px}
.exp button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-weight:600;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.exp button:hover{border-color:var(--forest);color:var(--forest)}
.exp .xl:hover{border-color:#1D6F42;color:#1D6F42}.exp .pd2:hover{border-color:#A23B3B;color:#A23B3B}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
.filters input{min-width:170px}
.filters .lb{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar .nm{width:150px;font-size:12.3px;font-weight:500}
.bar .tk{flex:1;background:#EEF1EC;border-radius:20px;height:14px;overflow:hidden}
.bar .fl{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--forest),var(--mint))}
.bar .fl.hot{background:linear-gradient(90deg,var(--hot),#d98a6a)}.bar .fl.warm{background:linear-gradient(90deg,var(--warm),#e8c48a)}
.bar .vl{width:110px;text-align:right;font-size:11.5px;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.rc{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;transition:.15s}
.rc:hover{transform:translateY(-2px);border-color:var(--brass)}
.rc .ic{font-size:20px;color:var(--brass)}.rc h4{font-size:14px;margin:7px 0 4px}.rc p{font-size:11.5px;color:var(--muted);margin:0 0 9px}
.rc .tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--canvas);color:var(--forest);border:1px solid var(--line)}
/* doc */
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);max-width:920px;margin:0 auto 16px;overflow:hidden}
.dm{background:var(--fd);color:#fff;padding:22px 30px;position:relative;overflow:hidden}
.dm .bg{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(45deg,#fff 25%,transparent 25% 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25% 75%,#fff 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.dm .w{position:relative;font-family:Georgia,serif;font-weight:700;font-size:15px}.dm .w b{color:var(--brass)}
.dm .rt{position:relative;font-family:Georgia,serif;font-size:22px;font-weight:600;margin-top:8px}
.dm .rs{position:relative;font-size:11.5px;color:var(--mint);margin-top:3px}
.dm .bd{position:absolute;top:22px;right:30px}
.db{padding:22px 30px 28px}
.db h4{font-family:Georgia,serif;font-size:15px;color:var(--forest);margin:19px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--brass2)}.db h4:first-child{margin-top:0}
.db p{font-size:12.8px;line-height:1.6;margin:0 0 10px;color:#2f3c37}.db p .k{font-weight:700;color:var(--ink)}
.snap{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.snap .s{background:var(--canvas);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.snap .s .v{font-family:Georgia,serif;font-size:19px;color:var(--forest);font-weight:600}.snap .s .v.bad{color:var(--hot)}
.snap .s .k{font-size:9.2px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.rd{border-radius:9px;padding:12px 14px;font-size:12.5px;line-height:1.55;margin:8px 0}
.rd.g{background:#E4F1EE;border-left:3px solid var(--forest);color:#20473c}.rd.a{background:#FBF2E7;border-left:3px solid var(--warm);color:#7a5a1e}.rd.r{background:#FBEEEA;border-left:3px solid var(--hot);color:#6a4a41}
.hm{display:flex;gap:2px;overflow-x:auto;padding:5px 0}
.hm .c{min-width:25px;text-align:center}
.hm .c .bx{height:23px;border-radius:3px;display:grid;place-items:center;font-size:9px;font-weight:700}
.hm .c .mo{font-size:7px;color:var(--muted);margin-top:2px;writing-mode:vertical-rl;height:32px}
.rec{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.rec .rn{width:24px;height:24px;border-radius:6px;background:var(--forest);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0;font-family:ui-monospace}
.rec .rb{font-size:12.5px;color:#2f3c37}.rec .rb b{color:var(--ink)}
.sg{font-size:10.5px;color:var(--muted);margin-top:15px}
/* forms */
.form{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 22px}
.fs{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:700;margin:16px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}.fs:first-child{margin-top:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.fl2{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px}.f label{font-size:12px;font-weight:600}.f .rq{color:var(--hot)}
.f input,.f select,.f textarea{font-size:13px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.f textarea{min-height:54px;resize:vertical}.f .hp{font-size:10.5px;color:var(--muted)}
.f .fk{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#FBFAF6;color:var(--muted);font-size:13px}
.drop{border:1.5px dashed #CBD3CE;border-radius:10px;padding:13px;text-align:center;color:var(--muted);font-size:12px;background:#FCFBF7}.drop b{color:var(--forest)}
.ck{display:flex;flex-direction:column;gap:7px;margin-top:11px}.ck label{display:flex;gap:8px;font-size:12.3px;align-items:flex-start}
.cp{background:#EFE7CF;border:1px solid var(--brass);border-radius:9px;padding:10px 12px;font-size:12.3px;color:#5f4c11;margin-top:12px}.cp b{font-family:ui-monospace;font-size:14px;color:#7d6413}
.fa{display:flex;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.sk:last-child{border-bottom:0}
.sk .n{width:150px;font-size:12.3px;font-weight:500}
.tg{display:flex;gap:5px}.tg button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:600}.tg button.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* attendance */
.cc{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.ch .tm{font-family:ui-monospace;font-weight:700;font-size:13.5px;color:var(--forest);width:78px}
.ch .i{flex:1}.ch .i .v{font-weight:600;font-size:13.3px}.ch .i .m{font-size:11px;color:var(--muted)}
.ch .st{font-size:11px;color:var(--muted);text-align:right}.ch .st b{color:var(--forest)}
.cc.op .cr{transform:rotate(90deg)}.cr{color:var(--muted);transition:.2s}
.ros{border-top:1px solid var(--line);padding:5px 16px 15px;display:none;background:linear-gradient(180deg,#FBFAF6,#fff)}.cc.op .ros{display:block}
.sr{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}.sr:last-child{border-bottom:0}
.sr .g{width:32px;height:32px;border-radius:8px;background:var(--canvas);display:grid;place-items:center;font-weight:600;color:var(--forest);font-size:12px}
.sr .n{flex:1;font-weight:500;font-size:12.8px}.sr .n small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}
.sr .n small.bad{color:var(--hot);font-weight:600}
.at{display:flex;gap:5px}.at button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600}
.at .P.on{background:var(--ok);border-color:var(--ok);color:#fff}.at .A.on{background:var(--hot);border-color:var(--hot);color:#fff}.at .M.on{background:var(--brass);border-color:var(--brass);color:#241f10}
.sb{display:flex;align-items:center;gap:11px;margin-top:13px;flex-wrap:wrap}.sb select{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.hint{font-size:11px;color:var(--muted);margin-top:7px;font-style:italic}
.ft{margin-top:20px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px}
.wb{background:#FBF2E7;border:1px solid #EAD5AE;color:#7a5a1e;border-radius:10px;padding:12px;font-size:12.3px;text-align:center;margin:14px 0}
#t{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:12.3px;z-index:60;transition:.25s;max-width:90vw}
#t.on{opacity:1;transform:translateX(-50%) translateY(0)}#t b{color:var(--mint)}
.hb{display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;place-items:center;font-size:17px}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:.2s;z-index:50;height:100vh}.side.op{transform:none}.kpis,.kpis.k5,.kpis.k3,.snap,.rgrid{grid-template-columns:repeat(2,1fr)}.g2,.g3,.fg{grid-template-columns:1fr}.hb{display:grid}}
@media print{.side,.top,.exp,.btn,.mini,.filters{display:none!important}.view{padding:0;max-width:100%}.doc{box-shadow:none;border:0;max-width:100%}.panel{break-inside:avoid;box-shadow:none}}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px}

.sdbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:11px 14px;margin-bottom:13px;position:sticky;top:62px;z-index:15}
.obar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:11px 14px;margin-bottom:13px}
.sdg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sdl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-right:2px}
.sdbar select,.obar select,.obar input{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;max-width:180px}
.rbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:11px 0 5px}
.rbg2{display:grid;grid-template-columns:1fr 1fr;gap:5px}.rbg2 select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:11.5px;background:#fff}
.rbck{display:flex;flex-wrap:wrap;gap:0}.rbck .chip{border-color:var(--line);background:#fff}.rbck .chip.on{background:var(--forest);border-color:var(--forest)}
.segt{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segt button{border:0;border-right:1px solid var(--line);padding:6px 10px;font-size:11.5px;font-weight:600;background:#fff;color:var(--muted)}
.segt button:last-child{border-right:0}.segt button.on{background:var(--forest);color:#fff}
.cnt{font-size:11px;color:var(--muted);font-weight:600}
.warn .b{font-size:12.5px;color:#9a7a3e}
@media print{.sdbar,.obar{display:none!important}}

.mband{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:var(--r);overflow:hidden;margin-bottom:16px;box-shadow:var(--sh)}
.mb{background:var(--fd);color:#fff;padding:15px 14px;position:relative}
.mb .ml{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#9FC4B8;font-weight:600}
.mb .mn{font-family:Georgia,serif;font-size:27px;font-weight:600;margin:5px 0 3px;line-height:1;color:#fff}
.mb .mx{font-size:10.5px;color:#8FB6AB;line-height:1.35}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:14px}
.dcard{background:#fff;border:1px solid var(--line);border-top:3px solid var(--forest);border-radius:var(--r);box-shadow:var(--sh);padding:15px 17px}
